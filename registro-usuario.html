


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediTurno | Crear cuenta</title>

    <link rel="stylesheet" href="styles.css">
    <script src="registro-usuario.js" defer></script>
</head>

<body class="auth-page">

    <a href="index.html" class="auth-brand">
        <img
            src="imagnes integrador/logo.png"
            alt="Logo de Essência Saúde"
        >
        <span>Essência Saúde</span>
    </a>

    <main class="form-card">

        <header class="form-header">
            <h1>Crear una cuenta</h1>
            <p>
                Regístrate en MediTurno para reservar tus citas médicas.
            </p>
        </header>

        <form id="form-registro" novalidate>

            <!-- Nombre -->
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    autocomplete="given-name"
                    minlength="2"
                    maxlength="60"
                    required
                    placeholder="Ingresa tu nombre"
                >
            </div>

            <!-- Apellido paterno -->
            <div class="form-group">
                <label for="apellidoPaterno">Apellido paterno</label>
                <input
                    type="text"
                    id="apellidoPaterno"
                    name="apellidoPaterno"
                    autocomplete="family-name"
                    minlength="2"
                    maxlength="60"
                    required
                    placeholder="Ingresa tu apellido paterno"
                >
            </div>

            <!-- Apellido materno -->
            <div class="form-group">
                <label for="apellidoMaterno">Apellido materno</label>
                <input
                    type="text"
                    id="apellidoMaterno"
                    name="apellidoMaterno"
                    minlength="2"
                    maxlength="60"
                    required
                    placeholder="Ingresa tu apellido materno"
                >
            </div>

            <!-- Fecha de nacimiento -->
            <div class="form-group">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input
                    type="date"
                    id="fechaNacimiento"
                    name="fechaNacimiento"
                    autocomplete="bday"
                    required
                >
            </div>

            <!-- Género -->
            <div class="form-group">
                <label for="genero">Género</label>
                <select
                    id="genero"
                    name="genero"
                    required
                >
                    <option value="">Selecciona una opción</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro</option>
                    <option value="Prefiero no decir">
                        Prefiero no decir
                    </option>
                </select>
            </div>

            <!-- Correo electrónico -->
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    autocomplete="email"
                    maxlength="150"
                    required
                    placeholder="ejemplo@correo.com"
                >
            </div>

            <!-- Celular -->
            <div class="form-group">
                <label for="celular">Celular</label>
                <input
                    type="tel"
                    id="celular"
                    name="celular"
                    autocomplete="tel"
                    maxlength="20"
                    required
                    placeholder="Ingresa tu número de celular"
                >
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="72"
                    required
                    placeholder="Crea una contraseña"
                >
                <small class="form-help">
                    Utiliza al menos 8 caracteres.
                </small>
            </div>

            <!-- Confirmar contraseña -->
            <div class="form-group">
                <label for="confirmar-contrasena">
                    Confirmar contraseña
                </label>
                <input
                    type="password"
                    id="confirmar-contrasena"
                    name="confirmarContrasena"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="72"
                    required
                    placeholder="Repite tu contraseña"
                >
            </div>

            <!-- Consentimiento de privacidad -->
            <div class="form-group">
                <label for="acepta-privacidad">
                    <input
                        type="checkbox"
                        id="acepta-privacidad"
                        name="aceptaPrivacidad"
                        required
                    >
                    Acepto el tratamiento de mis datos personales según
                    la política de privacidad.
                </label>
            </div>

            <!-- Botón de registro -->
            <button
                type="submit"
                class="btn btn-primary btn-block"
                id="btn-registrar"
            >
                Crear cuenta
            </button>

            <!-- Mensajes de respuesta -->
            <p
                id="mensaje-registro"
                class="form-message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <div class="text-center">
            <p>
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

            <a href="index.html">Volver al inicio</a>
        </div>

    </main>

    <footer class="auth-footer">
        MediTurno · Essência Saúde
    </footer>

</body>
</html>
