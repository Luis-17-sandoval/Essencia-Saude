
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediTurno | Crear cuenta</title>

    <link rel="stylesheet" href="styles.css">
    <script src="registro-usuario.js" defer></script>
</head>

<body class="auth-page">

    <a href="index.html" class="auth-brand">
        <img
            src="imagnes integrador/logo.png"
            alt="Logo de Essência Saúde"
        >
        <span>Essência Saúde</span>
    </a>

    <main class="form-card">
        <header class="form-header">
            <h1>Crear una cuenta</h1>
            <p>
                Regístrate en MediTurno para poder reservar tus citas médicas.
            </p>
        </header>

        <form id="form-registro" novalidate>
            <div class="form-group">
                <label for="nombre">Nombres y apellidos</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    autocomplete="name"
                    minlength="3"
                    maxlength="100"
                    required
                    placeholder="Ingresa tus nombres y apellidos"
                >
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    autocomplete="email"
                    maxlength="150"
                    required
                    placeholder="ejemplo@correo.com"
                >
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (opcional)</label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    autocomplete="tel"
                    maxlength="20"
                    placeholder="Tu número de contacto"
                >
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="72"
                    required
                    placeholder="Crea una contraseña"
                >
                <small class="form-help">
                    Utiliza al menos 8 caracteres.
                </small>
            </div>

            <div class="form-group">
                <label for="confirmar-contrasena">
                    Confirmar contraseña
                </label>
                <input
                    type="password"
                    id="confirmar-contrasena"
                    name="confirmarContrasena"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="72"
                    required
                    placeholder="Repite tu contraseña"
                >
            </div>

            <div class="form-group">
                <label>
                    <input
                        type="checkbox"
                        id="acepta-privacidad"
                        name="aceptaPrivacidad"
                        required
                    >
                    Acepto el tratamiento de mis datos personales según
                    la política de privacidad.
                </label>
            </div>

            <button
                type="submit"
                class="btn btn-primary btn-block"
                id="btn-registrar"
            >
                Crear cuenta
            </button>

            <p
                id="mensaje-registro"
                class="form-message"
                role="status"
                aria-live="polite"
            ></p>
        </form>

        <div class="text-center">
            <p>
                ¿Ya tienes una cuenta?
                <a href="iniciar-sesion.html">Inicia sesión</a>
            </p>

            <a href="index.html">Volver al inicio</a>
        </div>
    </main>

    <footer class="auth-footer">
        MediTurno · Essência Saúde
    </footer>

</body>
</html>
