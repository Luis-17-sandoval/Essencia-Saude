
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediTurno | Iniciar sesión</title>

    <link rel="stylesheet" href="styles.css">
    <script src="iniciar-sesion.js" defer></script>
</head>

<body class="auth-page">

    <!-- Marca de la plataforma -->
    <a href="index.html" class="auth-brand">
        <img
            src="imagnes integrador/logo.png"
            alt="Logo de Essência Saúde"
        >
        <span>Essência Saúde</span>
    </a>

    <main class="form-card">

        <!-- Encabezado -->
        <header class="form-header">
            <h1>¡Bienvenido de nuevo!</h1>
            <p>
                Inicia sesión en MediTurno para gestionar tus citas médicas.
            </p>
        </header>

        <!-- Formulario de acceso -->
        <form id="form-login" novalidate>

            <!-- Correo -->
            <div class="form-group">
                <label for="correo">Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    autocomplete="email"
                    maxlength="150"
                    placeholder="ejemplo@correo.com"
                    required
                >
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label for="contrasena">Contraseña</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        autocomplete="current-password"
                        maxlength="72"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                    <button
                        type="button"
                        id="btn-mostrar-contrasena"
                        class="password-toggle"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false"
                    >
                        Mostrar
                    </button>
                </div>
            </div>

            <!-- Botón de acceso -->
            <button
                type="submit"
                id="btn-login"
                class="btn btn-primary btn-block"
            >
                Iniciar sesión
            </button>

            <!-- Mensajes -->
            <p
                id="mensaje-login"
                class="form-message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <!-- Enlaces -->
        <div class="text-center">
            <p>
                ¿Todavía no tienes una cuenta?
                <a href="registro-usuario.html">Crear cuenta</a>
            </p>

            <a href="index.html">Volver al inicio</a>
        </div>

    </main>

    <footer class="auth-footer">
        MediTurno · Essência Saúde
    </footer>

</body>
</html>
