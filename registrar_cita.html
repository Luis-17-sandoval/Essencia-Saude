<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar cita | MediTurno</title>

    <link rel="stylesheet" href="styles.css">
    <script src="registrar-cita.js" defer></script>
</head>

<body class="registro-page">

    <!-- Encabezado -->
    <header class="registro-header">
        <a href="index.html" class="registro-brand">
            <span class="registro-brand-icon">✚</span>
            <span>Essência Saúde </span>
        </a>

        <nav class="registro-nav">
            <a href="index.html">Inicio</a>
            <a href="index.html">Especialidades</a>
            <a href="registrar_cita.html" class="nav-active">Reservar</a>
            <a href="index.html">Contacto</a>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main class="registro-container">

        <section class="registro-form-section">
            <h1>Ingresa tus datos personales</h1>

            <p class="registro-description">
                Completa la información para registrar tu cita médica.
            </p>

            <form id="form-cita" class="registro-form">

                <p id="usuario-conectado" class="registro-description"></p>

                <div class="form-field">
                    <label for="especialidad">Especialidad</label>
                    <select id="especialidad" name="especialidad" required>
                        <option value="">Cargando especialidades...</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="medico">Médico</label>
                    <select id="medico" name="medico" required disabled>
                        <option value="">Primero selecciona una especialidad</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="horario">Fecha y hora disponible</label>
                    <select id="horario" name="horario" required disabled>
                        <option value="">Primero selecciona un médico</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="motivo">Motivo de la consulta (opcional)</label>
                    <textarea id="motivo" name="motivo" maxlength="500" rows="3" placeholder="Describe brevemente el motivo"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="registro-button">
                        Registrar cita
                    </button>
                    <button type="reset" class="registro-button" id="limpiar-formulario">
                        Limpiar formulario
                    </button>
                    <a href="index.html" class="registro-back">
                        Volver al panel
                    </a>
                </div>

                <p id="mensaje-formulario" class="registro-message" role="status" aria-live="polite" hidden>
                </p>

            </form>
        </section>

        <!-- Imagen de marca -->

        <aside class="registro-image-section">
            <div class="registro-logo">
                <img class="registro-logo-image" src="imagnes integrador/logo.png" alt="Logotipo de MediTurno">
            </div>
        </aside>


    </main>

</body>

</html>
